[project]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
name = "rootscope"
version = "0.1.1"
description = "Compute plant root traits from SLEAP root predictions with NumPy and pandas."
readme = "README.md"
authors = [
    { name = "Oscar Felix", email = "68672681+ofelix60@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "sleap-io>=0.9.5",
]

[project.urls]
Repository = "https://github.com/ofelix60/rootscope"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "sleap-roots==0.1.4",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # errors, pyflakes, import order, bugbear, modern syntax

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sleap_io.*", "sleap_roots.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
